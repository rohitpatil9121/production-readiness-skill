name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          bash -n install.sh
          bash -n skills/production-readiness/scripts/scan.sh
          bash -n tests/run.sh
          python -m py_compile skills/production-readiness/scripts/routes.py
      - name: Tests
        run: bash tests/run.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck (errors only)
        run: shellcheck --severity=error install.sh skills/production-readiness/scripts/scan.sh tests/run.sh
      - name: Validate JSON manifests
        run: |
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
